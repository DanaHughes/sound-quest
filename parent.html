<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Phonics Sound Studio</title>
<meta name="description" content="Interactive sound-spelling lessons built from Dana's Phonics Sound Cards and homeschool lesson plan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one classroom "desk". Sticky header with views, then a lesson workspace whose
   five steps follow the lesson plan in order. Cards are drawn like the printed cards:
   white, thick dark border, rounded corners. Single light "paper" look by design. */
:root{
  color-scheme: light;
  --paper:#f6f8fc;      /* page ground, cool paper */
  --desk:#ffffff;       /* panels */
  --ink:#1b2333;        /* text and card borders */
  --muted:#5a6377;
  --line:#dbe2ee;
  --sky:#d3ecfc;  --sky-ink:#1d6aa8;   /* vowel box blue from the cards */
  --sun:#ffeaa6;  --sun-ink:#7a5200;   /* digraph box yellow */
  --mint:#dcf3cf; --mint-ink:#2c6e27;  /* long-vowel box green */
  --red:#df2a2a;                       /* target letters, red like the keyword cards */
  --k:#f2c230; --g1:#e85d3d;           /* semester colors from the scope & sequence */
  --good:#2c8a3e; --soft-good:#e3f5e6;
  --read:"Andika", "Comic Sans MS", "Trebuchet MS", sans-serif;
  --display:"Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--display);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sky-ink);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600}
.read{font-family:var(--read)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;background:none;border:0;padding:0}
.brand .stack{position:relative;width:34px;height:40px}
.brand .stack i{position:absolute;inset:0;border:3px solid var(--ink);border-radius:7px;background:#fff}
.brand .stack i:nth-child(1){transform:rotate(-10deg);background:var(--sun)}
.brand .stack i:nth-child(2){transform:rotate(6deg);background:var(--sky)}
.brand .stack i:nth-child(3){display:grid;place-items:center;font-family:var(--read);font-weight:700;font-size:18px}
.brand b{font-size:20px;font-weight:700;letter-spacing:.2px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{border:2px solid var(--line);background:var(--desk);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px}
.nav button[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.banner{background:var(--sun);border:2px solid #f0d27a;border-radius:12px;padding:10px 14px;margin-top:14px;font-size:15px}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:3px solid var(--ink);background:#fff;font-weight:600;font-size:17px;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--ink);color:#fff}
.btn.sky{background:var(--sky)} .btn.sun{background:var(--sun)} .btn.mint{background:var(--mint)}
.btn.small{min-height:40px;padding:6px 12px;font-size:15px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.btn.ghost{border-color:var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--desk);border:2px solid var(--line);border-radius:var(--r);padding:18px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;border:2px solid var(--line);background:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;margin-top:20px}
.continue{display:flex;gap:18px;align-items:center}
.continue .scard{width:130px;flex:none}
.continue h2{font-size:30px}
.continue .pat{font-family:var(--read);font-size:44px;font-weight:700;line-height:1.1}
.steps-key{display:grid;gap:8px;font-size:15px}
.steps-key div{display:flex;gap:10px;align-items:baseline}
.steps-key b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;flex:none}
.seq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px;align-items:start}
.sem{border:3px solid var(--k);border-radius:var(--r);background:#fff;padding:12px}
.sem.g1{border-color:var(--g1)}
.sem h3{font-size:18px;margin-bottom:8px}
.sem ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.les{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:8px;text-align:left;border:0;background:transparent;border-radius:10px;padding:6px 8px}
.les:hover{background:var(--paper)}
.les .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.les .t{font-family:var(--read);font-size:17px;min-width:0;overflow-wrap:anywhere}
.les .t small{font-family:var(--display);color:var(--muted);font-size:12px;margin-left:4px}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.les.current{background:var(--sun)}

/* lesson */
.lhead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-top:18px}
.lhead .back{border:0;background:none;color:var(--sky-ink);font-weight:600;padding:0}
.lhead h1{font-family:var(--read);font-size:clamp(34px,6vw,52px);font-weight:700;line-height:1}
.lhead .snd{font-family:var(--read);font-size:22px;color:var(--muted)}
.lnav{display:flex;gap:8px;margin-left:auto}
.tabs{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;font-weight:600}
.tab b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-size:13px}
.tab.done b{background:var(--good);color:#fff}
.tab[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.tab[aria-selected="true"] b{background:#fff;color:var(--ink)}
.tab small{font-weight:500;opacity:.75}
.stage{margin-top:14px;display:grid;gap:16px}
.guide{border:2px dashed var(--line);border-radius:var(--r);background:#fff}
.guide summary{cursor:pointer;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.guide summary::marker{color:var(--muted)}
.guide .body{padding:0 16px 14px;max-width:70ch;font-size:15px}
.timer{margin-left:auto;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.timer span{font-weight:700;min-width:52px;text-align:right}
.stepfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* cards */
.scard{position:relative;aspect-ratio:400/557;width:100%;max-width:100%;border:4px solid var(--ink);border-radius:18px;background:#fff;overflow:hidden}
.scard img{display:block;width:100%;height:100%;object-fit:cover}
.scard.made{display:flex;flex-direction:column;padding:8% 7%;gap:6%}
.scard.made .pic{flex:1;display:grid;place-items:center;font-size:min(22vw,92px);line-height:1}
.scard.made .cbox{border:1.5px solid #2f4a7a;border-radius:12px;padding:6% 4%;text-align:center;font-family:var(--read)}
.scard.made .kw{font-size:14px}
.scard.made .kw em{color:var(--red);font-style:normal}
.scard.made .sp{font-size:26px;font-weight:700;line-height:1.15;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}
.tone-sun{background:linear-gradient(#fff6d6,var(--sun))}
.tone-sky{background:radial-gradient(var(--sky),#eaf6fe)}
.tone-mint{background:radial-gradient(var(--mint),#f0faea)}
.madetag{position:absolute;top:6px;right:6px;font-size:10px;font-weight:600;background:#fff;border:1.5px dashed var(--muted);color:var(--muted);border-radius:6px;padding:1px 5px;font-family:var(--display)}
.cover{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(135deg,#ffd98a 0 14px,#ffcf6b 14px 28px);border-top:3px dashed var(--ink);display:grid;place-items:center;touch-action:none;cursor:grab;transition:transform .35s ease}
.cover span{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:15px}
.cover.gone{transform:translateY(105%)}

/* meet */
.meet{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.cardtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cardtabs button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-family:var(--read);font-weight:700;font-size:16px}
.cardtabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--sky)}
.spells{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.spells span{font-family:var(--read);font-size:22px;font-weight:700;border:2px solid var(--line);border-radius:12px;padding:2px 12px;background:#fff}
.spells span.focus{border-color:var(--red);color:var(--red)}
.spells span.added{border-style:dashed}
.spells sup{font-family:var(--display);font-size:12px;color:var(--muted);margin-right:3px}
.chant{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.chip{font-family:var(--read);font-weight:700;font-size:clamp(22px,4vw,34px);padding:8px 16px;border-radius:16px;border:3px solid var(--line);background:#fff;transition:transform .15s,background .15s,border-color .15s}
.chip.snd{color:var(--sky-ink)}
.chip.on{background:var(--sun);border-color:var(--ink);transform:scale(1.08)}
.stars{display:flex;gap:6px;font-size:30px;line-height:1}
.stars i{font-style:normal;color:var(--line);transition:color .2s,transform .2s}
.stars i.on{color:#f2b705;transform:scale(1.15)}
.move{display:flex;gap:16px;align-items:center;background:var(--mint);border:2px solid #b8e2a8;border-radius:var(--r);padding:14px}
.move .ico{font-size:44px;line-height:1;flex:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
.move p{margin:4px 0 0;font-size:18px;font-family:var(--read)}

/* words */
.word{font-family:var(--read);font-weight:700;letter-spacing:.5px}
.word .g.t{color:var(--red)}
.word .g.silent{opacity:.55}
.hidecolors .word .g.t{color:inherit}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.wbtn{position:relative;border:3px solid var(--line);border-radius:14px;background:#fff;padding:10px 6px;font-size:26px}
.wbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--sun)}
.wbtn .ok{position:absolute;top:2px;right:6px;font-size:14px;color:var(--good);font-family:var(--display)}
.wstage{display:grid;gap:16px;justify-items:center;text-align:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:64px;min-height:78px;padding:6px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-family:var(--read);font-weight:700;font-size:clamp(36px,8vw,58px);line-height:1.15;display:grid;place-items:center;transition:background .15s,transform .15s}
.tile.t{color:var(--red);background:#fff4f4}
.hidecolors .tile.t{color:var(--ink);background:#fff}
.tile.silent{border-style:dashed;opacity:.7}
.tile.on{background:var(--sun)!important;transform:translateY(-6px)}
.tile.found{box-shadow:0 0 0 5px var(--red)}
.tile small{display:block;font-size:12px;font-family:var(--display);font-weight:500;color:var(--muted)}
.slide{position:relative;width:min(560px,100%);height:64px;border-radius:999px;background:var(--sky);border:3px solid var(--ink);touch-action:none;user-select:none}
.slide .knob{position:absolute;top:50%;left:0;width:56px;height:56px;margin-top:-28px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:24px;cursor:grab}
.slide .lab{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;color:var(--sky-ink);pointer-events:none}

/* write */
.wtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 12px;font-weight:600;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.canvaswrap{position:relative;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;touch-action:none}
.canvaswrap canvas{display:block;width:100%;height:auto;touch-action:none}
.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bigpat{font-family:var(--read);font-weight:700;font-size:64px;line-height:1;text-align:center;padding:10px;border-radius:14px;background:var(--paper)}
.peek{user-select:none;touch-action:none}

/* spell */
.dict{display:grid;gap:16px;justify-items:center;text-align:center}
.sounds{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.scol{display:grid;gap:8px;justify-items:center}
.schip{position:relative;font-family:var(--read);font-weight:700;font-size:22px;color:var(--sky-ink);border:2px solid var(--line);border-radius:12px;padding:4px 10px;background:#fff;min-width:64px}
.schip .num{position:absolute;top:-10px;right:-10px;background:var(--red);color:#fff;border-radius:999px;font-size:12px;padding:1px 6px;font-family:var(--display)}
.schip.on{background:var(--sun);border-color:var(--ink)}
.box{width:76px;height:86px;border:3px dashed var(--muted);border-radius:14px;display:grid;place-items:center;background:#fff;font-family:var(--read);font-weight:700;font-size:42px}
.box.filled{border-style:solid;border-color:var(--ink)}
.box.right{background:var(--soft-good);border-color:var(--good)}
.box.wrong{background:#ffecec;border-color:var(--red)}
.box.hot{background:var(--sky)}
.box small{font-size:11px;font-family:var(--display);color:var(--muted);font-weight:500;align-self:end}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:620px}
.ptile{min-width:62px;height:66px;padding:0 12px;border:3px solid var(--ink);border-radius:14px;background:var(--sun);font-family:var(--read);font-weight:700;font-size:34px;box-shadow:0 3px 0 var(--ink);touch-action:none;user-select:none}
.ptile.used{visibility:hidden}
.dragghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);opacity:.9;margin:0}
.answer{font-size:44px}

/* hunt */
.sentences{display:grid;gap:14px}
.sent{display:flex;flex-wrap:wrap;gap:6px 4px;font-size:clamp(26px,4.6vw,36px)}
.hw{border:0;background:transparent;border-radius:10px;padding:2px 6px;font-family:var(--read);font-weight:700}
.hw.hit{background:var(--sun);box-shadow:inset 0 -4px 0 var(--red)}
.hw.miss{animation:shake .35s}
.hw .t{color:var(--red)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tally{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tally .count{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;min-width:70px;text-align:center}
.marks{display:flex;gap:10px;flex-wrap:wrap}
.marks i{display:inline-block;width:6px;height:34px;background:var(--ink);border-radius:3px}
.marks span{display:inline-flex;gap:5px;position:relative}
.marks span.five::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:5px;background:var(--red);transform:rotate(-22deg)}
input[type=text]{font:inherit;font-family:var(--read);font-size:18px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;width:100%;max-width:340px;background:#fff;color:var(--ink)}

/* wall + review */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin-top:16px}
.wcard{position:relative;border:0;background:none;padding:0;text-align:center}
.wcard .lock{position:absolute;inset:0;display:grid;place-items:center;background:rgba(246,248,252,.72);border-radius:18px;font-size:30px}
.wcard figcaption{font-size:14px;margin-top:4px;color:var(--muted)}
.review{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px;align-items:start;margin-top:16px}
.piles{display:flex;gap:16px;flex-wrap:wrap}
.pile{flex:1;min-width:140px;border:3px solid var(--line);border-radius:var(--r);padding:12px;background:#fff}
.pile b{font-size:34px;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:40;background:rgba(27,35,51,.55);display:grid;place-items:center;padding:16px}
.modal .inner{background:#fff;border-radius:22px;border:3px solid var(--ink);padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px;justify-items:center}
.modal .scard{width:min(260px,70vw)}

/* settings */
.set{display:grid;gap:16px;max-width:640px;margin-top:18px}
.set label{font-weight:600;display:block;margin-bottom:6px}
select{font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;min-height:48px;width:100%;background:#fff;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--ink)}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(calc(100% + 60px));visibility:hidden;background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-weight:600;z-index:60;transition:transform .25s;max-width:calc(100% - 32px);text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:55}

/* ---------- kid mode (student version) ---------- */
body.kid{font-size:18px}
.kid .brand b{font-size:22px}
.kid .nav button{font-size:17px;padding:10px 18px}
.kid .tab{font-size:17px;padding:10px 16px}
.kid .stepfoot .btn{min-height:56px;font-size:19px;padding:12px 26px}
.next{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:center;margin-top:20px;background:var(--desk);border:3px solid var(--ink);border-radius:24px;padding:20px;box-shadow:0 5px 0 var(--ink)}
.next .scard{width:150px}
.next .big{font-family:var(--read);font-weight:700;font-size:clamp(48px,9vw,76px);line-height:1;color:var(--red)}
.next .snd{font-family:var(--read);font-size:26px;color:var(--muted);margin-left:8px}
.next h2{font-size:24px;margin-bottom:8px}
.next .go{font-size:24px;min-height:64px;padding:12px 34px;margin-top:14px}
.starbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;font-weight:600}
.starbar .meter{flex:1;min-width:160px;height:16px;border-radius:999px;background:var(--line);overflow:hidden}
.starbar .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--k),#f2b705);border-radius:999px}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px;margin-top:16px}
.stop{position:relative;aspect-ratio:1;border-radius:22px;border:3px solid var(--line);background:#fff;display:grid;place-items:center;align-content:center;gap:2px;padding:6px;transition:transform .12s}
.stop:hover{transform:translateY(-3px)}
.stop .n{font-size:12px;color:var(--muted);font-weight:600}
.stop .p{font-family:var(--read);font-weight:700;font-size:clamp(18px,3.6vw,24px);line-height:1.05;text-align:center;overflow-wrap:anywhere}
.stop .st{position:absolute;top:-10px;right:-8px;font-size:22px;line-height:1}
.stop.part{border-color:var(--sky-ink)}

/* ---------- parsing ---------- */
function parseWord(code, map){
  const toks = code.split('-').map(part=>{
    let star = part.includes('*');
    let t = part.replace(/\*/g,'');
    let [g,key] = t.split('=');
    let split = false;
    if(g==='e_'){ g='e'; split=true; key='0'; }
    const gl = g.toLowerCase();
    if(!key){ key = (star && map && map[gl]) ? map[gl] : (DEF[gl] || gl); }
    return {g, key, star, split};
  });
  return {text: toks.map(t=>t.g).join(''), toks};
}
const LESSONS = [];
const BYID = {};
RAW.forEach((r,i)=>{
  const L = Object.assign({}, r, {idx:i});
  L.words = r.w ? r.w.split(' ').map(c=>parseWord(c, r.m)) : [];
  if(r.from){
    const pool = [];
    r.from.forEach(id=>{ const src = BYID[id]; if(src) src.words.slice(0, r.from.length>3?3:5).forEach(w=>pool.push(w)); });
    L.words = L.words.concat(pool);
  }
  L.hunt = r.h || [];
  LESSONS.push(L); BYID[L.id] = L;
});

const sleep = ms => new Promise(r=>setTimeout(r,ms));
const Speech = {
  ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  voices:[], voice:null, run:0,
  init(){
    if(!this.ok) return;
    const pick = ()=>{
      try{
        this.voices = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang) || v.lang==='en');
        this.voice = this.voices.find(v=>v.name===prefs.voice)
          || this.voices.find(v=>/en[-_]US/i.test(v.lang) && /(Google|Samantha|Aria|Jenny|Natural|Ava)/i.test(v.name))
          || this.voices.find(v=>/en[-_]US/i.test(v.lang)) || this.voices[0] || null;
        if(state.view==='settings') render();
      }catch(e){}
    };
    pick();
    try{ speechSynthesis.addEventListener('voiceschanged', pick); }catch(e){ speechSynthesis.onvoiceschanged = pick; }
  },
  stop(){ this.run++; if(this.current){ try{ this.current.pause(); }catch(e){} } if(this.ok){ try{ speechSynthesis.cancel(); }catch(e){} } },
  clipCache:{},
  playClip(key){
    return new Promise(res=>{
      let a = this.clipCache[key];
      if(!a){ a = new Audio('audio/'+CLIPS[key]+'.mp3'); a.preload='auto'; this.clipCache[key]=a; }
      let done=false; const fin=()=>{ if(!done){ done=true; clearTimeout(t); a.onended=a.onerror=null; res(); } };
      const t = setTimeout(fin, 2500);
      this.current = a;
      try{ a.pause(); a.currentTime = 0; }catch(e){}
      a.onended = fin; a.onerror = fin;
      const pr = a.play(); if(pr && pr.catch) pr.catch(fin);
    });
  },
  say(text, rate=1){
    if(typeof text==='string' && text[0]==='@' && CLIPS[text.slice(1)]) return this.playClip(text.slice(1));
    return new Promise(res=>{
      if(!this.ok || !text){ setTimeout(res, text ? 500 : 250); return; }
      let done=false; const fin=()=>{ if(!done){ done=true; clearTimeout(t); res(); } };
      const u = new SpeechSynthesisUtterance(text);
      if(this.voice) u.voice = this.voice;
      u.lang = (this.voice && this.voice.lang) || 'en-US';
      u.rate = Math.max(.4, Math.min(1.6, rate * (prefs.rate || .85)));
      u.onend = fin; u.onerror = fin;
      const t = setTimeout(fin, 1500 + text.length*140/u.rate);
      try{ speechSynthesis.speak(u); }catch(e){ fin(); }
    });
  },
  /* parts: [{text, rate, gap, i}] — onStep(i) lights up the matching chip */
  async seq(parts, onStep){
    this.stop(); const my = this.run; await sleep(60);
    for(const p of parts){
      if(my!==this.run) return false;
      onStep && onStep(p.i);
      await this.say(p.text, p.rate||1);
      if(my!==this.run) return false;
      await sleep(p.gap ?? 220);
    }
    onStep && onStep(-1);
    return my===this.run;
  }
};

/* spoken letter names for a spelling: "a_e" -> "A, consonant, E" */
function spellSay(sp){
  sp = cleanSp(sp).replace(/…/g,'');
  if(/^[a-z]_[a-z]$/.test(sp)) return `${sp[0].toUpperCase()}, consonant, ${sp[2].toUpperCase()}`;
  return sp.replace(/_/g,'').split('').map(ch=>ch.toUpperCase()).join('. ')+'.';
}
function cardSpellingsFor(L, cid){

  return focus;
}
function chantParts(cid, L){
  const c = CARDS[cid];

  let endShow, endSay;

  if(rec && prefs.clips !== false && (!fc.length || (fc.length===1 && fc[0]===first))){
    const snd3 = [{show:showOf(s), snd:1}, {show:showOf(s), snd:1}, {show:showOf(s), snd:1}];
    const list = rec.order==='sssw'   /* recorded as: sound x3, picture word, letter names */
      ? snd3.concat([{show:key}, {show:rec.name}])

/* Plays one chant: Dana's recording when there is one, otherwise the computer voice.
   onStep(i) lights up chip i; resolves true if it finished without being stopped. */
function runChant(parts, onStep){
  if(parts[0] && parts[0].rec){
    const rec = CHANT_REC[parts[0].rec];
    Speech.stop(); const my = Speech.run;
    return new Promise(res=>{
      const a = new Audio('audio/chant_'+parts[0].rec+'.mp3'); Speech.current = a;
      let raf=0, done=false;
      const tick=()=>{ if(done) return; const t=a.currentTime; let i=-1; rec.t.forEach((st,j)=>{ if(t>=st-0.02) i=j; }); onStep && onStep(i); raf=requestAnimationFrame(tick); };
      const fin=ok=>{ if(done) return; done=true; cancelAnimationFrame(raf); onStep && onStep(-1); res(ok && my===Speech.run); };
      a.onended=()=>fin(true); a.onerror=()=>fin(false); a.onpause=()=>{ if(!a.ended) fin(false); };
      const pr=a.play(); if(pr && pr.catch) pr.catch(()=>fin(false));
      raf=requestAnimationFrame(tick);
    });
  }
  return Speech.seq(parts.map((p,i)=>({text:p.say, rate:p.snd?.75:.9, gap:p.snd?200:260, i})), onStep);
}
function cardHTML(cid, opts={}){

    let kw = esc(c.key);

  return `<div class="scard"><img src="cards/${cid}.webp" alt="${esc(c.key)} sound card" loading="lazy" draggable="false">${cover}</div>`;

/* which spelling (and its number on the card) a starred token uses */
function spellingFor(tok, w, L){
  if(!tok.star || tok.split) return null;
  const i = w.toks.indexOf(tok); const next = w.toks[i+1];
  let sp = tok.g.toLowerCase();
  const hasSplit = w.toks.some(t=>t.split && t.star);
  if(hasSplit && /^[aeiou]$/.test(sp)) sp = sp+'_e';
  else if(sp==='c' && tok.key==='s') sp = next && /^i/i.test(next.g) ? 'ci' : 'ce';
  else if(sp==='g' && tok.key==='j') sp = next && /^i/i.test(next.g) ? 'gi' : 'ge';
  const cards = (L.c||[]).concat(CARD_ORDER);
  for(const cid of cards){
    const list = CARDS[cid].sp.map(cleanSp);
    const n = list.indexOf(sp);
    if(n>=0) return {cid, num:n+1, total:list.length, sp};
  }
  return null;
}

    const idx = Math.min(w.toks.length-1, Math.floor(frac*w.toks.length*0.999));

    } else if(idx!==last){
      last = idx; tiles.forEach((t,j)=>t.classList.toggle('on', j===idx));
      const tok = w.toks[idx]; if(tok.key!=='0'){ Speech.stop(); Speech.say(sayOf(tok.key), .8); }
    }
  };

}

let pad = null;
function setupCanvas(){
  const cv = $('#pad'); if(!cv) return;
  const L = LESSONS[state.li]; const p = L.p[Math.min(state.write.pat, L.p.length-1)];
  const text = p.length===1 ? `${p.toUpperCase()}${p}` : p.replace('_',' ');
  const ctx = cv.getContext('2d');
  const strokes = []; let cur = null; let sandTex = null;
  const size = ()=>{
    const w = cv.parentElement.clientWidth; const h = Math.round(Math.min(340, Math.max(220, w*0.45)));
    const dpr = window.devicePixelRatio||1;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); cv.style.height = h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0); sandTex = null; draw();
  };
  const W = ()=>cv.width/(window.devicePixelRatio||1), H = ()=>cv.height/(window.devicePixelRatio||1);
  function makeSand(){
    const c = document.createElement('canvas'); c.width = Math.ceil(W()); c.height = Math.ceil(H());
    const x = c.getContext('2d'); x.fillStyle = '#e9cf98'; x.fillRect(0,0,c.width,c.height);
    for(let i=0;i<c.width*c.height/22;i++){ x.fillStyle = Math.random()<.5?'rgba(160,120,60,.22)':'rgba(255,248,225,.5)'; x.fillRect(Math.random()*c.width, Math.random()*c.height, 1.4, 1.4); }
    return c;
  }
  function draw(){
    const w = W(), h = H(); const s = state.write.surface;
    ctx.clearRect(0,0,w,h);
    if(s==='sand'){ sandTex = sandTex || makeSand(); ctx.drawImage(sandTex,0,0); }
    else { ctx.fillStyle = s==='board' ? '#fbfdff' : '#ffffff'; ctx.fillRect(0,0,w,h); }
    const top = h*0.16, mid = h*0.44, base = h*0.72, desc = h*0.92;
    if(s==='paper'){
      ctx.lineWidth = 2; ctx.strokeStyle = '#9fb7d6'; ctx.setLineDash([]);
      [top, base].forEach(y=>{ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); });
      ctx.setLineDash([10,8]); ctx.beginPath(); ctx.moveTo(0,mid); ctx.lineTo(w,mid); ctx.stroke();
      ctx.setLineDash([]); ctx.strokeStyle='#f0b3b3'; ctx.beginPath(); ctx.moveTo(0,desc); ctx.lineTo(w,desc); ctx.stroke();
    }
    // guide letters: cap height spans top->base
    const fs = (base-top)/0.72;
    ctx.font = `700 ${fs}px Andika, "Comic Sans MS", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    let tw = ctx.measureText(text).width; let f2 = fs;
    if(tw > w*0.9){ f2 = fs*(w*0.9)/tw; ctx.font = `700 ${f2}px Andika, "Comic Sans MS", sans-serif`; }
    const spaced = text.split('').join(String.fromCharCode(8202));
    ctx.fillStyle = s==='sand' ? 'rgba(120,85,30,.22)' : 'rgba(27,35,51,.10)';
    ctx.fillText(spaced, w/2, base);
    ctx.setLineDash([6,7]); ctx.lineWidth = 2; ctx.strokeStyle = s==='sand' ? 'rgba(110,75,25,.5)' : 'rgba(27,35,51,.35)';
    ctx.strokeText(spaced, w/2, base); ctx.setLineDash([]);
    strokes.concat(cur?[cur]:[]).forEach(drawStroke);
  }
  function drawStroke(st){
    if(st.pts.length<1) return;
    ctx.lineCap='round'; ctx.lineJoin='round';
    const pts = st.pts;
    const path = ()=>{ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); if(pts.length===1) ctx.lineTo(pts[0][0]+.1,pts[0][1]); };
    if(st.sand){
      ctx.lineWidth = 22; ctx.strokeStyle = 'rgba(150,110,50,.55)'; path(); ctx.stroke();
      ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(110,75,30,.55)'; path(); ctx.stroke();
    } else { ctx.lineWidth = st.board?9:7; ctx.strokeStyle = st.color; path(); ctx.stroke(); }
  }
  const pos = e=>{ const r = cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.addEventListener('pointerdown', e=>{ e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} cur = {pts:[pos(e)], color:state.write.color, sand:state.write.surface==='sand', board:state.write.surface==='board'}; draw(); });
  cv.addEventListener('pointermove', e=>{ if(!cur) return; cur.pts.push(pos(e)); draw(); });
  const end = ()=>{ if(cur){ strokes.push(cur); cur=null; draw(); } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  const ro = new ResizeObserver(()=>size()); ro.observe(cv.parentElement);
  cleanup.push(()=>ro.disconnect());
  pad = {clear(){ strokes.length=0; cur=null; draw(); }, has(){ return strokes.length>0; }};
  size();
  if(document.fonts && document.fonts.load){ document.fonts.load('700 80px Andika').then(()=>draw()).catch(()=>{}); }
  // press-and-hold peek for the back-writing game
  const pk = $('.peek');
  if(pk){
    const orig = pk.textContent;
    const show = e=>{ e.preventDefault(); pk.textContent = pk.dataset.peek; pk.classList.add('read'); pk.style.fontSize='40px'; };
    const hide = ()=>{ pk.textContent = orig; pk.classList.remove('read'); pk.style.fontSize=''; };
    pk.addEventListener('pointerdown', show); ['pointerup','pointerleave','pointercancel'].forEach(ev=>pk.addEventListener(ev, hide));
    pk.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter') show(e); }); pk.addEventListener('keyup', hide);
  }
}

/* ---------- 4. SPELL (dictation) ---------- */
function spellView(L){
  const w = L.words[state.spell.wi % L.words.length];
  const S = state.spell;
  if(S.forWord !== w.text+L.id){
    S.forWord = w.text+L.id; S.boxes = w.toks.map(()=>null); S.checked = false; S.shown = false;
    const bank = w.toks.map(t=>t.g.toLowerCase());
    const extra = new Set();
    w.toks.forEach(t=>{ if(t.star){ const sp = spellingFor(t,w,L); const card = sp ? CARDS[sp.cid] : null;
      if(card) card.sp.map(cleanSp).filter(x=>!x.includes('_')).forEach(x=>{ x=x.replace(/^_/,''); if(!bank.includes(x)) extra.add(x); }); } });
    let ex = shuffle([...extra]).slice(0,3);
    const fillers = shuffle(['m','s','t','p','n','d','b','l','r','h','g','f'].filter(x=>!bank.includes(x)));
    while(ex.length<3) ex.push(fillers.shift());
    S.tiles = shuffle(bank.concat(ex)).map((g,i)=>({g, id:i, used:false}));
  }
  const chips = w.toks.map((t,i)=>{
    const sp = spellingFor(t,w,L);
    const num = sp && sp.total>1 ? `<span class="num">#${sp.num}</span>` : '';
    const label = t.key==='0' ? 'silent e' : showOf(t.key);
    return `<div class="scol"><span class="schip" data-i="${i}">${esc(label)}${num}</span>
      ${S.mode==='tiles'?`<div class="box${S.boxes[i]?' filled':''}${S.checked?(S.boxes[i]&&S.boxes[i].g===t.g.toLowerCase()?' right':' wrong'):''}" data-box="${i}" role="button" tabindex="0" aria-label="Box ${i+1}${S.boxes[i]?': '+S.boxes[i].g:': empty'}">${S.boxes[i]?esc(S.boxes[i].g):(t.key==='0'?'<small>silent</small>':'')}</div>`:''}
    </div>`;
  }).join('');
  const numbered = w.toks.map(t=>spellingFor(t,w,L)).filter(x=>x && x.total>1);
  return `
  <section class="panel dict">
    <div class="row" style="justify-content:space-between;width:100%">
      <p class="eyebrow">Word ${S.wi % L.words.length + 1} of ${L.words.length}</p>
      <div class="seg" role="group" aria-label="How your child answers">
        <button aria-pressed="${S.mode==='tiles'}" data-act="smode" data-v="tiles">Build with tiles</button>
        <button aria-pressed="${S.mode==='paper'}" data-act="smode" data-v="paper">Write on paper</button>
      </div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn sky" data-act="dictate">▶ Say the word and its sounds</button>
      <button class="btn ghost" data-act="dictword">Word only</button>
    </div>
    <div class="sounds" id="sounds">${chips}</div>
    ${numbered.length?`<p class="muted" style="margin:0">Red numbers match the spelling numbers on the ${numbered.map(n=>esc(CARDS[n.cid].key)).join(', ')} card. Keep the card in view.</p>`:''}
    ${S.mode==='tiles' ? `
      <div class="bank" id="bank">${S.tiles.map(t=>`<button class="ptile${t.used?' used':''}" data-tile="${t.id}" aria-label="Letter tile ${esc(t.g)}">${esc(t.g)}</button>`).join('')}</div>
      <div class="row" style="justify-content:center">
        <button class="btn ghost" data-act="sclear">Start over</button>
        <button class="btn mint" data-act="scheck">Check my word</button>
        <button class="btn primary" data-act="snext">Next word ›</button>
      </div>` : `
      <p class="read" style="font-size:18px;margin:0">Write the word on paper or a whiteboard. Then check it.</p>
      <div class="row" style="justify-content:center">
        <button class="btn mint" data-act="sshow">Show the spelling</button>
        <button class="btn primary" data-act="snext">Next word ›</button>
      </div>
      ${S.shown?`<div class="answer">${wordHTML(w)}</div>`:''}`}
  </section>`;
}
function dictate(L, wordOnly){
  const w = L.words[state.spell.wi % L.words.length];
  const chips = $$('#sounds .schip');
  const parts = [{text:`Please write the word ${w.text}.`, gap:350, i:-2}, {text:w.text, rate:.8, gap:500, i:-2}];
  if(!wordOnly){
    w.toks.forEach((t,i)=>{
      if(t.key==='0'){ parts.push({text:'silent e', rate:.9, gap:300, i}); return; }
      const sp = spellingFor(t,w,L);
      const num = sp && sp.total>1;
      parts.push({text: sayOf(t.key), rate:.75, gap: num ? 150 : 450, i});
      if(num) parts.push({text:`spelling number ${sp.num}`, rate:.9, gap:450, i});
    });
    parts.push({text:w.text, rate:.8, gap:100, i:-2});
  }
  Speech.seq(parts, i=>chips.forEach((c,j)=>c.classList.toggle('on', j===i)));
}
function placeTile(id, boxIdx){
  const S = state.spell; const tile = S.tiles.find(t=>t.id===id); if(!tile || tile.used) return;
  if(boxIdx==null) boxIdx = S.boxes.findIndex(b=>!b);
  if(boxIdx<0) return;
  if(S.boxes[boxIdx]){ const old = S.tiles.find(t=>t.id===S.boxes[boxIdx].id); if(old) old.used=false; }
  S.boxes[boxIdx] = {g:tile.g, id:tile.id}; tile.used = true; S.checked=false;
  const L = LESSONS[state.li]; const w = L.words[S.wi % L.words.length]; const tok = w.toks[boxIdx];
  if(tok && tok.key!=='0'){ Speech.stop(); Speech.say(sayOf(tok.key), .8); }
  render();
}
function bindDrag(){
  const bank = $('#bank'); if(!bank) return;
  let drag = null;
  bank.addEventListener('pointerdown', e=>{
    const t = e.target.closest('.ptile'); if(!t) return;
    drag = {id:+t.dataset.tile, x:e.clientX, y:e.clientY, el:t, ghost:null, moved:false};
    try{ t.setPointerCapture(e.pointerId); }catch(_){}
  });
  bank.addEventListener('pointermove', e=>{
    if(!drag) return;
    if(!drag.moved && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) > 8){
      drag.moved = true; drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add('dragghost'); document.body.appendChild(drag.ghost); drag.el.style.opacity='.3';
    }
    if(drag.moved){
      drag.ghost.style.left = e.clientX+'px'; drag.ghost.style.top = e.clientY+'px';
      $$('.box').forEach(b=>b.classList.remove('hot'));
      const under = document.elementFromPoint(e.clientX, e.clientY); const box = under && under.closest('.box'); if(box) box.classList.add('hot');
    }
  });
  const end = e=>{
    if(!drag) return; const d = drag; drag = null;
    if(d.ghost){ d.ghost.remove(); d.el.style.opacity=''; }
    if(!d.moved){ placeTile(d.id, null); return; }
    const under = document.elementFromPoint(e.clientX, e.clientY); const box = under && under.closest('.box');
    $$('.box').forEach(b=>b.classList.remove('hot'));
    if(box) placeTile(d.id, +box.dataset.box);
  };
  bank.addEventListener('pointerup', end); bank.addEventListener('pointercancel', e=>{ if(drag&&drag.ghost){ drag.ghost.remove(); drag.el.style.opacity=''; } drag=null; });
}

/* ---------- 5. HUNT ---------- */
function huntWords(L){
  const out = [];
  L.hunt.forEach((s,si)=>s.split(' ').forEach((raw,wi)=>{
    const m = raw.match(/^([^A-Za-z']*)([A-Za-z']+)(\*?)(.*)$/);
    if(!m) out.push({si, wi, pre:raw, word:'', target:false, post:''});
    else out.push({si, wi, pre:m[1], word:m[2], target:!!m[3], post:m[4]});
  }));
  return out;
}
function patHL(word, L){
  const found = L.words.find(w=>w.text.toLowerCase()===word.toLowerCase());
  if(found) return found.toks.map(t=>t.star?`<span class="t">${esc(t.g)}</span>`:esc(t.g)).join('');
  for(const p of L.p){
    if(p.includes('_')){
      const re = new RegExp(`(${p[0]})([^aeiouy]{1,2})(${p[2]})`,'i'); const m = word.match(re);
      if(m){ const i = m.index; return esc(word.slice(0,i))+`<span class="t">${esc(m[1])}</span>${esc(m[2])}<span class="t">${esc(m[3])}</span>`+esc(word.slice(i+m[0].length)); }
    } else {
      const i = word.toLowerCase().lastIndexOf(p);
      if(i>=0) return esc(word.slice(0,i))+`<span class="t">${esc(word.slice(i,i+p.length))}</span>`+esc(word.slice(i+p.length));
    }
  }
  return esc(word);
}
function huntView(L){
  const ws = huntWords(L);
  const key = L.id+':hunt'; const found = new Set(prog.found[key]||[]);
  const total = ws.filter(w=>w.target).length;
  const sents = L.hunt.map((s,si)=>`<p class="sent read">${ws.filter(w=>w.si===si).map(w=>{
    const id = `${w.si}-${w.wi}`; const hit = found.has(id);
    return w.word ? `<span>${esc(w.pre)}<button class="hw${hit?' hit':''}" data-act="hw" data-id="${id}" data-t="${w.target?1:0}" data-w="${esc(w.word)}">${hit?patHL(w.word,L):esc(w.word)}</button>${esc(w.post)}</span>` : `<span>${esc(w.pre)}</span>`;
  }).join(' ')}</p>`).join('');
  const t = prog.tally[L.id] || {n:0, words:[]};
  const groups = []; for(let i=0;i<t.n;i+=5) groups.push(Math.min(5, t.n-i));
  return `
  <section class="panel">
    <div class="row" style="justify-content:space-between">
      <p class="eyebrow">Tap every word that has ${esc(L.p.join(', '))}</p>

    </div>

  </section>
  <section class="panel">
    <p class="eyebrow">Book hunt tally</p>
    <p style="margin:4px 0 12px">Open your Word Hunt worksheet or a book from your shelf. Every time you spot <b class="read">${esc(L.p.join(', '))}</b>, tap the big button.</p>
    <div class="tally">
      <button class="btn sun" data-act="tally" data-d="1" style="min-height:64px;font-size:22px">+ I found one!</button>
      <span class="count" aria-live="polite">${t.n}</span>
      <div class="marks" aria-hidden="true">${groups.map(g=>`<span class="${g===5?'five':''}">${'<i></i>'.repeat(Math.min(g,4))}</span>`).join('')}</div>
      <button class="btn small ghost" data-act="tally" data-d="-1">Undo</button>
    </div>
    <form class="row" data-form="hwords" style="margin-top:14px">

    ${t.words.length?`<div class="spells" style="margin-top:10px">${t.words.map((w,i)=>`<button class="btn small ghost read" data-act="sayw" data-w="${esc(w)}" style="font-size:20px">${patHL(w,L)}</button>`).join('')}</div>`:''}
  </section>`;

function stars(n){ $$('#stars i').forEach((el,i)=>el.classList.toggle('on', i<n)); }
async function playChant(times){
  const L = LESSONS[state.li]; const cid = L.c[Math.min(state.card, L.c.length-1)];
  const parts = chantParts(cid, L); const chips = $$('#chant .chip');
  for(let r=0;r<times;r++){
    const ok = await runChant(parts, i=>chips.forEach((el,j)=>el.classList.toggle('on', j===i)));
    if(!ok) return;
    if(times>1){ state.chants = Math.min(3,(state.chants||0)+1); stars(state.chants); if(state.chants>=3) markStep(L.id,'meet'); await sleep(500); }
  }
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act; const L = LESSONS[state.li];
  switch(a){
    case 'home': go('home'); break;
    case 'wall': go('wall'); break;
    case 'review': go('review'); break;
    case 'settings': go('settings', {confirmReset:false}); break;
    case 'open': { const i=+b.dataset.i; prog.last = Math.max(prog.last||0, i); saveProg(); go('lesson', {li:i, step:0, card:0, wi:0, chants:0, write:{...state.write, pat:0, count:0}, spell:{wi:0, mode:state.spell.mode}}); break; }
    case 'lesson-step': { const i = Math.max(0, Math.min(LESSONS.length-1, state.li + +b.dataset.d)); prog.last = Math.max(prog.last||0, i); saveProg(); go('lesson', {li:i, step:0, card:0, wi:0, chants:0, write:{...state.write, pat:0, count:0}, spell:{wi:0, mode:state.spell.mode}}); break; }
    case 'step': { const s=+b.dataset.s; if(s>=0 && s<STEPS.length) go('lesson', {step:s}); break; }
    case 'finish-step': {
      markStep(L.id, STEPS[state.step].k);
      if(state.step < STEPS.length-1) go('lesson', {step:state.step+1});
      else { celebrate(); toast(KID ? `Stop ${L.idx+1} done! You earned your stars ⭐` : `Lesson ${L.idx+1} finished!`); go('home'); }
      break; }
    case 'timer': e.preventDefault(); toggleTimer(); break;
    case 'card': state.card=+b.dataset.c; state.chants=0; render(); break;
    case 'chant': playChant(1); break;
    case 'chant3': state.chants=0; stars(0); playChant(3); break;
    case 'sound': Speech.stop(); Speech.say(sayOf(b.dataset.k), .75); break;
    case 'star': state.chants=Math.min(3,(state.chants||0)+1); stars(state.chants); if(state.chants>=3){ markStep(L.id,'meet'); toast('Three chants! Great job.'); } break;
    case 'pickword': state.wi=+b.dataset.w; render(); soundOut(L, L.words[state.wi]); break;
    case 'tok': { const w=L.words[state.wi]; const t=w.toks[+b.dataset.t]; Speech.stop(); if(t.key!=='0') Speech.say(sayOf(t.key), .75); if(t.star){ b.classList.add('found'); } else { b.animate && b.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:250}); } break; }
    case 'soundout': soundOut(L, L.words[state.wi]); break;
    case 'readword': Speech.stop(); Speech.say(L.words[state.wi].text, .85); markWordRead(L); break;
    case 'nextword': state.wi=(state.wi+1)%L.words.length; render(); break;
    case 'hide': state.hide=b.checked; render(); break;
    case 'wpat': state.write.pat=+b.dataset.p; render(); break;
    case 'surface': state.write.surface=b.dataset.v; render(); break;
    case 'color': state.write.color=b.dataset.v; $$('.swatch').forEach(s=>s.setAttribute('aria-pressed', s===b)); break;
    case 'wclear': pad && pad.clear(); break;
    case 'wsay': runChant(chantParts(L.c[0],L)); break;
    case 'traced': state.write.count=Math.min(3,state.write.count+1); pad && pad.clear(); $$('.stars i').forEach((el,i)=>el.classList.toggle('on', i<state.write.count)); if(state.write.count>=3){ markStep(L.id,'write'); toast('Traced 3 times!'); } break;
    case 'reveal-back': { const el=$('#backans'); el.textContent=b.dataset.v; Speech.stop(); Speech.say(spellSay(b.dataset.v)); break; }
    case 'smode': state.spell.mode=b.dataset.v; render(); break;
    case 'dictate': dictate(L,false); break;
    case 'dictword': dictate(L,true); break;
    case 'sclear': state.spell.forWord=null; render(); break;
    case 'scheck': {
      const S=state.spell; const w=L.words[S.wi%L.words.length]; S.checked=true;
      const right = w.toks.every((t,i)=>S.boxes[i] && S.boxes[i].g===t.g.toLowerCase());
      render();
      if(right){ Speech.stop(); Speech.say(`Yes! ${w.text}.`); celebrate(); S.right=(S.right||0)+1; if(S.right>=5) markStep(L.id,'spell'); }
      else { Speech.stop(); Speech.say('Almost. Fix the red boxes.'); }
      break; }
    case 'sshow': state.spell.shown=true; render(); Speech.stop(); Speech.say(L.words[state.spell.wi%L.words.length].text); state.spell.right=(state.spell.right||0)+1; if(state.spell.right>=5) markStep(L.id,'spell'); break;
    case 'snext': state.spell.wi++; state.spell.forWord=null; render(); dictate(L,false); break;
    case 'hw': {
      const id=b.dataset.id; const key=L.id+':hunt'; const s=new Set(prog.found[key]||[]);
      Speech.stop(); Speech.say(b.dataset.w, .85);
      if(b.dataset.t==='1'){ s.add(id); prog.found[key]=[...s]; saveProg(); b.classList.add('hit'); b.innerHTML=patHL(b.dataset.w,L);
        const total=huntWords(L).filter(w=>w.target).length; $('#huntcount').textContent=`${s.size} of ${total} found`;
        if(s.size>=total){ markStep(L.id,'hunt'); celebrate(); toast('You found them all!'); } }
      else { b.classList.remove('miss'); void b.offsetWidth; b.classList.add('miss'); }
      break; }
    case 'hreset': prog.found[L.id+':hunt']=[]; saveProg(); render(); break;
    case 'hread': { const parts=L.hunt.map(s=>({text:s.replace(/\*/g,''), rate:.85, gap:500})); Speech.seq(parts); break; }
    case 'tally': { const t=prog.tally[L.id]||{n:0,words:[]}; t.n=Math.max(0,t.n+ +b.dataset.d); prog.tally[L.id]=t; saveProg(); render(); break; }
    case 'sayw': Speech.stop(); Speech.say(b.dataset.w,.85); break;
    case 'wallcard': openCardModal(b.dataset.c); break;
    case 'rev-peek': { const cov=$('[data-cover]'); if(cov){ cov.classList.add('gone'); setTimeout(revealReview,300); } else revealReview(); break; }
    case 'rev-chant': chantSimple(b.dataset.c); break;
    case 'rev-sort': { const R=state.review; const cid=R.deck[R.i]; (b.dataset.v==='got'?R.got:R.again).push(cid); R.i++; R.revealed=false; Speech.stop(); render(); break; }
    case 'rev-again': { const ag=state.review.again; state.review={deck:shuffle(ag), i:0, got:[], again:[], revealed:false}; render(); break; }
    case 'rev-new': state.review=newDeck(); render(); break;
    case 'revall': state.reviewAll=b.checked; state.review=newDeck(); render(); break;
    case 'test': Speech.stop(); if(b.dataset.v==='word') Speech.say('Apple. Bread. Snake. Light.', .9); else Speech.seq(['a','e','i','o','u','A','E','I','O','U','b','k','d','f','g','h','j','l','m','n','p','kw','r','s','t','sh','th','ch','oo','aw','ow'].map(k=>({text:sayOf(k), rate:.75, gap:350}))); break;
    case 'clips': prefs.clips = b.checked; savePrefs(); break;
    case 'reset': state.confirmReset=true; render(); break;
    case 'reset-no': state.confirmReset=false; render(); break;
    case 'reset-yes': prog.done={}; prog.last=0; prog.tally={}; prog.found={}; saveProg(); state.confirmReset=false; state.review=null; toast('Progress cleared.'); render(); break;
  }
});
document.addEventListener('change', e=>{
  const a = e.target.dataset.act;
  if(a==='voice'){ prefs.voice=e.target.value; savePrefs(); Speech.voice = Speech.voices.find(v=>v.name===prefs.voice) || Speech.voice; Speech.stop(); Speech.say('Hello! Let us read.'); }
  if(a==='rate'){ prefs.rate=+e.target.value; savePrefs(); Speech.stop(); Speech.say('Apple, apple.'); }
});
document.addEventListener('submit', e=>{
  if(e.target.dataset.form!=='hwords') return; e.preventDefault();
  const inp = $('#hword'); const v = (inp.value||'').trim().replace(/[^A-Za-z' -]/g,'').slice(0,30); if(!v) return;
  const L = LESSONS[state.li]; const t = prog.tally[L.id]||{n:0,words:[]}; t.words.push(v); t.n = Math.max(t.n, t.words.length); prog.tally[L.id]=t; saveProg(); render();
  Speech.stop(); Speech.say(v, .85); setTimeout(()=>{ const i=$('#hword'); i && i.focus(); }, 30);
});
document.addEventListener('keydown', e=>{
  const box = e.target.closest && e.target.closest('.box');
  if(box && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); const S=state.spell; const i=+box.dataset.box; if(S.boxes[i]){ const t=S.tiles.find(x=>x.id===S.boxes[i].id); if(t) t.used=false; S.boxes[i]=null; S.checked=false; render(); } }
});
/* tapping a filled box sends its tile back to the bank */
document.addEventListener('click', e=>{
  const box = e.target.closest('.box'); if(!box || state.view!=='lesson') return;
  const S=state.spell; const i=+box.dataset.box; if(S.boxes[i]){ const t=S.tiles.find(x=>x.id===S.boxes[i].id); if(t) t.used=false; S.boxes[i]=null; S.checked=false; render(); }
});

/* ---------- step timer (keeps running while you work in the step) ---------- */
let timer = {key:null, left:0, h:null};
function bindTimer(){
  const key = state.li+':'+state.step;
  if(timer.key!==key){ clearInterval(timer.h); timer = {key, left:STEPS[state.step].min*60, h:null}; }
  paintTimer();
}
function paintTimer(){
  const wrap = $('[data-timer]'); const min = STEPS[state.step].min; if(!wrap || !min || state.view!=='lesson') return;
  const span = wrap.querySelector('span'); const btn = wrap.querySelector('button');
  span.textContent = `${Math.floor(timer.left/60)}:${String(timer.left%60).padStart(2,'0')}`;
  if(btn) btn.textContent = timer.h ? 'Pause' : timer.left===0 ? 'Time is up' : timer.left<min*60 ? 'Resume' : 'Start timer';
}
function toggleTimer(){
  if(timer.h){ clearInterval(timer.h); timer.h=null; paintTimer(); return; }
  if(timer.left<=0) return;
  timer.h = setInterval(()=>{
    timer.left = Math.max(0, timer.left-1); paintTimer();
    if(timer.left===0){ clearInterval(timer.h); timer.h=null; paintTimer(); toast('Time for the next step.'); }
  }, 1000);
  paintTimer();
}

/* ---------- celebration ---------- */
function celebrate(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c);
  const dpr = window.devicePixelRatio||1; c.width=innerWidth*dpr; c.height=innerHeight*dpr; const x=c.getContext('2d'); x.scale(dpr,dpr);
  const cols=['#df2a2a','#f2c230','#1d6aa8','#2c8a3e','#e85d3d'];
  const ps=Array.from({length:90},()=>({x:innerWidth/2+(Math.random()-.5)*120, y:innerHeight*.35, vx:(Math.random()-.5)*9, vy:-Math.random()*9-3, r:Math.random()*6+4, c:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6}));
  let f=0; (function tick(){ x.clearRect(0,0,innerWidth,innerHeight); ps.forEach(p=>{ p.vy+=.28; p.x+=p.vx; p.y+=p.vy; p.a+=.2; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6); x.restore(); }); if(++f<90) requestAnimationFrame(tick); else c.remove(); })();
}

/* ---------- boot ---------- */
if(KID){
  document.body.classList.add('kid');
  const b = document.querySelector('.brand b'); if(b) b.textContent = 'Sound Quest';
  const brand = document.querySelector('.brand'); if(brand) brand.setAttribute('aria-label','Sound Quest home');
  const nav = document.querySelector('.nav');
  if(nav) nav.innerHTML = '<button data-act="home" data-view="home">My Path</button><button data-act="wall" data-view="wall">Sound Wall</button><button data-act="review" data-view="review">Card Game</button>';
}
if(!KID && OTHER_APP){
  const nav = document.querySelector('.nav');
  if(nav) nav.insertAdjacentHTML('beforeend', `<a href="${OTHER_APP}" style="display:inline-flex;align-items:center;border:2px solid var(--line);background:var(--desk);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none">Student version ›</a>`);
}
Speech.init();
render();
</script>
